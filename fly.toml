# cvx, whole app in one container. Deploy: fly deploy (from the repo root).
#
# Secrets (fly secrets set ...): GROQ_API_KEY, CVX_SESSION_SECRET,
# GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET, RESEND_API_KEY,
# CVX_ALLOWED_EMAILS. Volume: fly volumes create cvx_data --size 1
app = "cvx"
primary_region = "lhr"

[build]

[env]
  CVX_ENV = "production"
  # The public origin. OAuth callbacks and every link in an email are built
  # from it, and the API is same-origin behind the Next proxy.
  CVX_BASE_URL = "https://cvx.example.com"

[[mounts]]
  source = "cvx_data"
  destination = "/app/data"

[http_service]
  # Next serves the public port; it proxies /api and /auth to the Go process
  # over loopback inside the container.
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
