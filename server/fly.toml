# cvx API on Fly.io. Deploy: fly deploy (from server/).
# Secrets (fly secrets set ...): GROQ_API_KEY, CVX_SESSION_SECRET,
# GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET, RESEND_API_KEY,
# CVX_ALLOWED_EMAILS. Volume: fly volumes create cvx_data --size 1
app = "cvx-api"
primary_region = "lhr"

[build]

[env]
  CVX_ENV = "production"
  # The public origin users sign in through (the Vercel domain), since OAuth
  # callbacks flow through the Next proxy.
  CVX_BASE_URL = "https://cvx.example.com"

[[mounts]]
  source = "cvx_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
